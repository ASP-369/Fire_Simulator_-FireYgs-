dataset_name: my_scene
scene: my_scene
x_rotation: 0
fire_sim_root: output/my_scene/sim_output
is_render_360: False

part_tree:
  current_scale: 0.9
  scale_step: 0.4
  min_scale: 0.1

# Fire box (initial tight box around the seat; up is +z). Measured from the labelled stool parts.
extract_voxel:
  bbox_min: [-1.5, -3.4, -8.2]
  bbox_max: [2.0, 0.1, -4.2]
  scale_factor: 1.1
  voxel_size: 128

# Expanded box + grid, generated by extract_voxel.py (output/my_scene/simulation_voxel.yaml)
bounding_box:
  min: [-1.9500000476837158, -3.8500001430511475, -8.399999618530273]
  max: [2.450000047683716, 0.5499999523162842, -3.999999761581421]
voxel_grid:
  dims: [128, 128, 128]
  voxel_size: 0.03437500074505806

# Combustion (wood, as in the Playground scene)
T_white: 12000
T_max: 1440
T_air: 273
k: 0.3
burn_rate: 0.045
beta: 50
alpha: 120
epsilon: 5
load_path: data/my_scene/voxel_grid.npy
load_path_indices_pts_in_grids: data/my_scene/indices_pts_in_grids.pth
load_path_mask_pts_in_grids: data/my_scene/mask_pts_in_grids.pth
sim_frames: 300
save_npz: True
save_vti: False

# Rendering
render_smoke: True
darkness: 1.0
add_sepc_light: True
use_perturb: True
spec_intensity: 1e-7
render_single: False
render_frame: 150
render_camera: 60
render_stride: 3
near: 2
far: 14
num_samples_coarse: 128
num_samples_fine: 1024
sampling_smooth_factor: 0.7
sampling_chunk_size: 32
camera_params:
  radius: 3
  azimuth_start: 0
  azimuth_end: 70
  elevation: 0
  x_offset: 0.0
  y_offset: 0.0
  z_offset: 0.0
  look_up_point: [0.2, -1.7, -7.0]

# Flame look (tuned on frame 150): voxels are ~3.3x larger than in the Firewoods scene, so use lower density
strength: 0.001
sigma_a: 0.3
smoke_strength: 0.1
